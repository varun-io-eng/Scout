<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scout</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="popup">
  <header>
    <div class="logo">🔭 Scout</div>
    <p class="tagline">Research copilot</p>

  <script src="popup.js"></script>
